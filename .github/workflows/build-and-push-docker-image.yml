name: Build and Push Docker Image

# Go 重写版专属工作流：与 main 分支的 C++ 版镜像互不覆盖，
# 本分支构建的镜像统一打 go / go-<日期> 标签。
on:
    push:
        branches:
            - go-rewrite
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # 登录到 GHCR
            - name: Log in to GitHub Container Registry (GHCR)
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 登录到阿里云 ACR
            - name: Log in to ACR
              uses: docker/login-action@v4
              with:
                  registry: ${{ secrets.ALIYUN_REGISTRY }}
                  username: ${{ secrets.ALIYUN_REGISTRY_USER }}
                  password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

            # 获取当前日期 (yyyy-MM-dd) 并强制用户名小写
            - name: Prepare Image Tags
              id: prep
              run: |
                  OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                  DATE=$(date +'%Y-%m-%d')
                  echo "owner=$OWNER" >> $GITHUB_OUTPUT
                  echo "date=$DATE" >> $GITHUB_OUTPUT

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  provenance: false
                  # 同时打上 go 和 go-日期 tag，避免覆盖 main 分支的 C++ 镜像
                  tags: |
                      ghcr.io/${{ steps.prep.outputs.owner }}/counter-strike-online:go
                      ghcr.io/${{ steps.prep.outputs.owner }}/counter-strike-online:go-${{ steps.prep.outputs.date }}
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/counter-strike-online:go
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/counter-strike-online:go-${{ steps.prep.outputs.date }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
